#VRML_SIM R2025a utf8

EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2025a/projects/appearances/protos/RoughConcrete.proto"

PROTO UpperSlabWithStairOpening [
  field SFVec3f translation -0.5 0 3.325
  field SFString name "upper slab with stair opening"
] {
  Solid {
    translation IS translation
    children [
      # Single continuous slab mesh with a rectangular stair opening
      # (hole x[-1.3,1.3], y[0.2,3.8]); one texCoord map -> no seams.
      # All faces wound outward so it renders solid/opaque.
      Shape {
        appearance RoughConcrete { colorOverride 0.899 0.859 0.87 }
        geometry IndexedFaceSet {
          coord Coordinate { point [
            -5.7 -4.2 0.125  5.7 -4.2 0.125  5.7 4.2 0.125  -5.7 4.2 0.125
            -1.3 0.2 0.125  1.3 0.2 0.125  1.3 3.8 0.125  -1.3 3.8 0.125
            -5.7 -4.2 -0.125  5.7 -4.2 -0.125  5.7 4.2 -0.125  -5.7 4.2 -0.125
            -1.3 0.2 -0.125  1.3 0.2 -0.125  1.3 3.8 -0.125  -1.3 3.8 -0.125
          ] }
          texCoord TextureCoordinate { point [
            0 0  1 0  1 1  0 1  0.385965 0.52381  0.614035 0.52381  0.614035 0.952381  0.385965 0.952381
            0 0  1 0  1 1  0 1  0.385965 0.52381  0.614035 0.52381  0.614035 0.952381  0.385965 0.952381
          ] }
          coordIndex [
            0 1 5 4 -1  1 2 6 5 -1  2 3 7 6 -1  3 0 4 7 -1
            12 13 9 8 -1  13 14 10 9 -1  14 15 11 10 -1  15 12 8 11 -1
            8 9 1 0 -1  9 10 2 1 -1  10 11 3 2 -1  11 8 0 3 -1
            4 5 13 12 -1  5 6 14 13 -1  6 7 15 14 -1  7 4 12 15 -1
          ]
          texCoordIndex [
            0 1 5 4 -1  1 2 6 5 -1  2 3 7 6 -1  3 0 4 7 -1
            12 13 9 8 -1  13 14 10 9 -1  14 15 11 10 -1  15 12 8 11 -1
            8 9 1 0 -1  9 10 2 1 -1  10 11 3 2 -1  11 8 0 3 -1
            4 5 13 12 -1  5 6 14 13 -1  6 7 15 14 -1  7 4 12 15 -1
          ]
        }
      }
      Pose { translation 0 3.8 0 children [ Shape { appearance DEF FORM PBRAppearance { baseColor 0.46 0.41 0.34 roughness 0.9 metalness 0 } geometry Box { size 2.6 0.04 0.25 } } ] }
      Pose { translation 1.3 2.0 0 children [ Shape { appearance USE FORM geometry Box { size 0.04 3.6 0.25 } } ] }
      Pose { translation -1.3 2.0 0 children [ Shape { appearance USE FORM geometry Box { size 0.04 3.6 0.25 } } ] }
    ]
    name IS name
    boundingObject Group {
      children [
        Pose { translation 0 -2.0 0 children [ Box { size 11.4 4.4 0.25 } ] }
        Pose { translation 0 4.0 0 children [ Box { size 11.4 0.4 0.25 } ] }
        Pose { translation -3.5 2.0 0 children [ Box { size 4.4 3.6 0.25 } ] }
        Pose { translation 3.5 2.0 0 children [ Box { size 4.4 3.6 0.25 } ] }
      ]
    }
  }
}
