#VRML_SIM R2025a utf8

# Four vertical reinforcement starter bars projecting from a level-2 column.
PROTO ColumnStarterBars [
  field SFVec3f translation 0 0 0
  field SFString name "column starter bars"
]
{
  Solid {
    translation IS translation
    children [
      Pose {
        translation 0.14 0.14 6.75
        rotation 0 0 1 0
        children [
          DEF REBAR_BAR Shape {
            appearance PBRAppearance {
              baseColor 0.45 0.28 0.18
              roughness 0.85
              metalness 0.5
            }
            geometry Cylinder {
              radius 0.012
              height 1.0
            }
          }
        ]
      }
      Pose {
        translation 0.14 -0.14 6.75
        rotation 0 0 1 0
        children [ USE REBAR_BAR ]
      }
      Pose {
        translation -0.14 0.14 6.75
        rotation 0 0 1 0
        children [ USE REBAR_BAR ]
      }
      Pose {
        translation -0.14 -0.14 6.75
        rotation 0 0 1 0
        children [ USE REBAR_BAR ]
      }
    ]
    name IS name
  }
}
